[build-system]
# XXX: If your project needs other packages to build properly, add them to this list.
requires = ["setuptools >= 64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "advtraj"
dynamic = ["version"]
authors = [
  { name='Leif Denby', email='l.c.denby@leeds.ac.uk'},
  { name='Peter Clark', email='p.clark@reading.ac.uk'},
]
description = "A small example package"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
dependencies = [
    "numpy",
    "scipy",
    "xarray",
    "netCDF4",
    "numba",
    "tqdm",
    "networkx",
	]

[tool.setuptools.packages.find]
where = ["src/"]

[project.urls]
Homepage = "https://github.com/ParaConUK/advtraj"
Issues = "https://github.com/ParaConUK/advtraj/issues"


[tool.setuptools_scm]
